name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal 2
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin --bundles app
          - name: Windows x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - name: Linux x64
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu --bundles appimage,deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libdbus-1-dev libssl-dev libxdo-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: MultiBoot v__VERSION__
          releaseBody: 可在下方下载对应平台安装包；客户端支持自动检查并安装后续更新。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: MultiBoot-[platform]-[arch]-[bundle]
          args: ${{ matrix.tauri_args }}

      - name: Verify Linux AppImage compatibility code
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle_dir="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"
          mapfile -t appimages < <(find "$bundle_dir" -maxdepth 1 -type f -name '*.AppImage')
          test "${#appimages[@]}" -eq 1

          extract_dir="$(mktemp -d)"
          appimage_path="$GITHUB_WORKSPACE/${appimages[0]}"
          (
            cd "$extract_dir"
            "$appimage_path" --appimage-extract
          )

          test -x "$extract_dir/squashfs-root/usr/bin/multiboot"
          strings "$extract_dir/squashfs-root/usr/bin/multiboot" | grep -Fq MULTIBOOT_APPIMAGE_SYSTEM_WEBKIT
