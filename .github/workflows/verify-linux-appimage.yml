name: Verify Linux AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-linux-appimage.yml"
      - "package-lock.json"
      - "package.json"
      - "src/**"
      - "src-tauri/**"
      - "vite.config.ts"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-linux-appimage.yml"
      - "package-lock.json"
      - "package.json"
      - "src/**"
      - "src-tauri/**"
      - "vite.config.ts"

permissions:
  contents: read

jobs:
  build-appimage:
    name: Build Linux x64 AppImage
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libdbus-1-dev libssl-dev libxdo-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci

      - name: Build unsigned AppImage
        run: >-
          npm run tauri -- build
          --bundles appimage
          --no-sign
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify Linux compatibility code is packaged
        shell: bash
        run: |
          mapfile -t appimages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage')
          test "${#appimages[@]}" -eq 1

          extract_dir="$(mktemp -d)"
          appimage_path="$GITHUB_WORKSPACE/${appimages[0]}"
          (
            cd "$extract_dir"
            "$appimage_path" --appimage-extract
          )

          test -x "$extract_dir/squashfs-root/usr/bin/multiboot"
          strings "$extract_dir/squashfs-root/usr/bin/multiboot" | grep -Fq MULTIBOOT_APPIMAGE_SYSTEM_WEBKIT

      - name: Upload verification AppImage
        uses: actions/upload-artifact@v4
        with:
          name: MultiBoot-Linux-x64-AppImage-verification
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
